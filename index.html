<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ألعاب PS4 المعربة - مكتب العراب</title>
    <!-- استدعاء خط Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- استدعاء أيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* =========================================
           إعدادات الألوان (الوضع الداكن والفاتح)
           ========================================= */
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1a1a1a;
            --nav-bg: #111;
            --text-color: #ffffff;
            --text-muted: #a0a0a0;
            --border-color: #333;
            --input-bg: #222;
            --primary-color: #2ecc71;
            --accent-color: #3498db;
            --danger-color: #e74c3c;
            --warning-color: #f39c12;
            --price-color: #f1c40f;
            --ps-blue: #0070d1;
            --yt-red: #ff0000;
        }

        body.light-mode {
            --bg-color: #f4f4f9;
            --card-bg: #ffffff;
            --nav-bg: #ffffff;
            --text-color: #111111;
            --text-muted: #666666;
            --border-color: #dddddd;
            --input-bg: #eeeeee;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 50px;
        }

        /* =========================================
           الشريط العلوي (Top Navbar)
           ========================================= */
        .top-navbar {
            background-color: var(--nav-bg);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--border-color);
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 15px;
            flex: 1;
        }

        .nav-btn {
            background-color: var(--input-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--primary-color);
            font-weight: bold;
            font-size: 18px;
            white-space: nowrap;
        }

        .nav-logo i { font-size: 22px; }

        /* شريط البحث */
        .nav-search {
            position: relative;
            width: 100%;
            max-width: 300px;
            margin-right: 10px;
        }

        .nav-search input {
            width: 100%;
            padding: 8px 35px 8px 35px; 
            border-radius: 20px;
            border: 1px solid var(--border-color);
            background-color: var(--input-bg);
            color: var(--text-color);
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .nav-search input:focus {
            border-color: var(--primary-color);
        }

        .search-icon {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 14px;
            pointer-events: none;
        }

        /* زر الحذف X */
        .clear-search {
            position: absolute;
            left: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            display: none; 
            font-size: 14px;
            padding: 4px;
            transition: color 0.2s;
        }

        .clear-search:hover {
            color: var(--danger-color);
        }

        .clear-search.visible {
            display: block;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* =========================================
           الشريط الجانبي (Sidebar)
           ========================================= */
        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 2500;
            display: none;
            backdrop-filter: blur(3px);
        }

        .sidebar-overlay.active {
            display: block;
        }

        .sidebar {
            position: fixed;
            top: 0;
            right: -300px; 
            width: 280px;
            height: 100%;
            background-color: var(--card-bg);
            border-left: 1px solid var(--border-color);
            z-index: 3000;
            transition: right 0.3s ease;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .sidebar.active {
            right: 0;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-header h2 {
            font-size: 18px;
            color: var(--primary-color);
        }

        .sidebar-close {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 24px;
            cursor: pointer;
        }

        .sidebar-menu-btn {
            background-color: var(--input-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 12px 15px;
            border-radius: 8px;
            text-align: right;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: 0.2s;
        }

        .sidebar-menu-btn:hover {
            background-color: var(--border-color);
        }

        .sidebar-menu-btn i {
            width: 20px;
            text-align: center;
            color: var(--primary-color);
        }

        /* =========================================
           مسار التنقل والمنصات
           ========================================= */
        .sub-nav {
            padding: 15px;
            background-color: var(--bg-color);
        }

        .breadcrumb {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 15px;
        }

        .breadcrumb span { color: var(--text-color); }

        .platforms-scroll {
            display: flex;
            gap: 25px;
            overflow-x: auto;
            padding-bottom: 10px;
            scrollbar-width: none;
            justify-content: flex-end;
        }
        .platforms-scroll::-webkit-scrollbar { display: none; }

        .platform-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            color: var(--text-muted);
            font-size: 13px;
            min-width: 60px;
            cursor: pointer;
        }

        .platform-item i { font-size: 26px; }

        .platform-item.active {
            color: var(--text-color);
            position: relative;
        }

        .platform-item.active::after {
            content: '';
            position: absolute;
            bottom: -10px;
            width: 100%;
            height: 3px;
            background-color: var(--ps-blue);
            border-radius: 3px;
        }

        /* البانر الرئيسي */
        .hero-banner {
            margin: 10px 15px;
            height: 180px;
            border-radius: 15px;
            background: linear-gradient(to bottom, rgba(15, 15, 15, 0.3), rgba(15, 15, 15, 0.7)), url('https://raw.githubusercontent.com/Hexor-Loader/hexor-website/refs/heads/main/icon/file_0000000026e88246a1a01e8bbf72e773.png') center/cover;
            border: 1px solid var(--border-color);
        }

        /* معلومات مكتب العراب */
        .shop-info-bar {
            margin: 15px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-size: 13px;
            color: var(--text-muted);
        }
        .shop-info-bar span { display: flex; align-items: center; gap: 8px; }
        .shop-info-bar .shop-name { color: var(--text-color); font-weight: bold; font-size: 15px; }
        .shop-info-bar i { width: 16px; text-align: center; }
        .shop-info-bar .shop-phone a { color: var(--primary-color); text-decoration: none; font-weight: bold; }

        /* شريط الفلاتر والفئات */
        .filter-bar {
            margin: 20px 15px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }
        
        .filter-bar-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .filter-tag {
            background-color: rgba(46, 204, 113, 0.1);
            color: var(--primary-color);
            border: 1px solid var(--primary-color);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }

        /* تنسيقات التصنيفات (Tabs) */
        .tabs-container {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 0 15px 15px 15px;
            scrollbar-width: none;
        }
        .tabs-container::-webkit-scrollbar { display: none; }

        .tab-btn {
            background-color: var(--card-bg);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.3s;
        }

        .tab-btn:hover {
            background-color: var(--border-color);
            color: var(--text-color);
        }

        .tab-btn.active {
            background-color: var(--primary-color);
            color: #111;
            border-color: var(--primary-color);
        }

        /* شبكة الألعاب */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 15px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
        }

        .game-card {
            background-color: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border-color);
        }

        .game-image {
            width: 100%;
            aspect-ratio: 3 / 4;
            background: var(--input-bg);
            position: relative;
            overflow: hidden;
        }

        .game-image img.cover {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .badges-bottom {
            position: absolute;
            bottom: 8px;
            left: 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            z-index: 10;
        }

        .badge {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
            color: white;
        }

        .badge.translated { background-color: #9b59b6; }
        .badge.arabic { background-color: #2980b9; }
        .badge.dubbed { background-color: #e74c3c; }

        .game-info {
            padding: 10px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .game-title-container {
            height: 42px; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-bottom: 8px;
            text-align: center;
        }

        .title-ar {
            font-size: 13px;
            font-weight: 700;
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        .title-en {
            font-size: 11px;
            color: var(--text-muted);
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        .game-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .game-stats span { display: flex; align-items: center; gap: 4px; }
        .rating i { color: var(--warning-color); }

        .game-price {
            font-size: 14px;
            font-weight: bold;
            color: var(--price-color);
            margin-bottom: 10px;
            text-align: center;
            background: rgba(241, 196, 15, 0.1);
            padding: 6px;
            border-radius: 6px;
            border: 1px dashed rgba(241, 196, 15, 0.3);
        }

        .action-buttons {
            display: flex;
            gap: 6px;
            margin-top: auto;
        }

        .btn-add, .btn-watch {
            flex: 1;
            padding: 8px 4px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: 0.3s;
            text-decoration: none;
            border: none;
        }

        .btn-add {
            background-color: var(--primary-color);
            color: #111;
        }

        .btn-add:hover { background-color: #27ae60; color: #fff; }

        .btn-watch {
            background-color: var(--yt-red);
            color: #fff;
        }

        .btn-watch:hover { background-color: #cc0000; }

        /* الترقيم */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin: 30px auto;
            padding: 0 10px;
            flex-wrap: wrap;
        }

        .page-btn {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 40px;
        }

        .page-btn:hover:not(:disabled) { background-color: var(--border-color); }
        .page-btn.active { background-color: var(--primary-color); color: #111; border-color: var(--primary-color); }
        .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 4000;
            backdrop-filter: blur(4px);
        }

        .modal-overlay.active { display: flex; }

        .modal-content {
            background-color: var(--card-bg);
            width: 90%;
            max-width: 400px;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border-color);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .modal-header h2 { font-size: 18px; color: var(--primary-color); }
        .btn-close { background: none; border: none; color: var(--text-muted); font-size: 22px; cursor: pointer; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 13px; }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--input-bg);
            color: var(--text-color);
            font-size: 14px;
        }
        .form-group input[readonly] { background-color: var(--bg-color); color: var(--text-muted); }
        
        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #25D366;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px;
            color: var(--text-muted);
        }

        /* للهواتف */
        @media (max-width: 600px) {
            .nav-search { max-width: 150px; }
            .nav-logo { font-size: 16px; }
        }
    </style>
</head>
<body>

    <!-- الشريط الجانبي (Sidebar) -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>القائمة الجانبية</h2>
            <button class="sidebar-close" onclick="toggleSidebar()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <!-- زر تغيير المظهر -->
        <button class="sidebar-menu-btn" onclick="toggleTheme()">
            <i class="fa-solid fa-moon" id="themeIcon"></i> تغيير المظهر (فاتح/داكن)
        </button>
        <!-- فلترة حسب المنصة -->
        <button class="sidebar-menu-btn" onclick="filterByPlatform('PS4', this)">
            <i class="fa-brands fa-playstation"></i> ألعاب PlayStation 4
        </button>
        <button class="sidebar-menu-btn" onclick="filterByPlatform('PS3', this)">
            <i class="fa-brands fa-playstation"></i> ألعاب PlayStation 3
        </button>
    </div>

    <!-- الشريط العلوي -->
    <nav class="top-navbar">
        <div class="nav-right">
            <div class="nav-logo">
                <i class="fa-solid fa-store" style="color: var(--warning-color);"></i> مكتب العراب
            </div>
            <!-- شريط البحث -->
            <div class="nav-search">
                <input type="text" id="searchInput" placeholder="ابحث عن لعبة..." oninput="toggleClearBtn()" onkeyup="filterGames()">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <!-- زر الحذف X -->
                <button id="clearSearchBtn" class="clear-search" onclick="clearSearch()"><i class="fa-solid fa-xmark"></i></button>
            </div>
        </div>
        
        <div class="nav-left">
            <!-- زر فتح الشريط الجانبي -->
            <button class="nav-btn" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
        </div>
    </nav>

    <div class="sub-nav">
        <div class="breadcrumb">
            Home <i class="fa-solid fa-chevron-left" style="font-size:10px; margin:0 5px;"></i> Arabic Games <i class="fa-solid fa-chevron-left" style="font-size:10px; margin:0 5px;"></i> <span id="currentPlatformText">PS4</span>
        </div>
        
        <div class="platforms-scroll">
            <div class="platform-item" onclick="filterByPlatform('PS3')">
                <i class="fa-brands fa-playstation"></i> PlayStation 3
            </div>
            <div class="platform-item active" onclick="filterByPlatform('PS4')">
                <i class="fa-brands fa-playstation"></i> PlayStation 4
            </div>
        </div>
    </div>

    <!-- كارد الصورة -->
    <div class="hero-banner"></div>

    <div class="shop-info-bar">
        <span class="shop-name"><i class="fa-solid fa-store" style="color: var(--warning-color);"></i> مكتب العراب</span>
        <span class="shop-phone"><i class="fa-solid fa-phone" style="color: var(--primary-color);"></i> الهاتف: <a href="tel:07712082333">07712082333</a></span>
        <span class="shop-address"><i class="fa-solid fa-location-dot" style="color: var(--accent-color);"></i> شارع المستشفى - مقابل اسواق ابو شيبة</span>
    </div>

    <div class="filter-bar">
        <div class="filter-bar-left">
            <span style="color: var(--primary-color); font-weight:bold;">444 الألعاب</span>
        </div>
        <div class="filter-tag">
            <span id="filterTagText">PS4</span> <i class="fa-solid fa-xmark" onclick="filterByPlatform('الكل')"></i>
        </div>
    </div>

    <!-- شريط التصنيفات (Tabs) -->
    <div class="tabs-container" id="tabsContainer">
        <button class="tab-btn active" onclick="filterByCategory('الكل', this)">الكل</button>
        <button class="tab-btn" onclick="filterByCategory('أكشن', this)">أكشن</button>
        <button class="tab-btn" onclick="filterByCategory('حروب', this)">حروب</button>
        <button class="tab-btn" onclick="filterByCategory('مغامرة', this)">مغامرة</button>
        <button class="tab-btn" onclick="filterByCategory('رياضة', this)">رياضة</button>
        <button class="tab-btn" onclick="filterByCategory('سباق', this)">سباق</button>
    </div>

    <div class="container" id="gamesContainer"></div>
    <div class="pagination" id="pagination"></div>

    <div class="modal-overlay" id="orderModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>طلب اللعبة</h2>
                <button class="btn-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="orderForm" onsubmit="sendToWhatsApp(event)">
                <div class="form-group">
                    <label>تفاصيل اللعبة</label>
                    <input type="text" id="gameNameInput" readonly>
                </div>
                <div class="form-group">
                    <label>الرسالة</label>
                    <textarea id="userMessage" rows="2" required>أريد طلب هذه اللعبة من فضلك</textarea>
                </div>
                <div class="form-group">
                    <label>رقم الهاتف</label>
                    <input type="tel" id="phoneNumber" placeholder="مثال: 077XXXXXXXX" required>
                </div>
                <button type="submit" class="btn-submit">
                    <i class="fa-brands fa-whatsapp fa-lg"></i> إرسال الطلب
                </button>
            </form>
        </div>
    </div>

    <script>
        const baseURL = "https://raw.githubusercontent.com/Hexor-Loader/hexor-website/main/images/";

        const gamesData = [
            // ===== الصفحة 1 =====

            { platform: "PS4", titleAr: "ليتل بيغ بلانيت 3", titleEn: "LittleBigPlanet 3", rating: "0.0", downloads: "1,000", size: "غير محدد", image: baseURL + "LittleBigPlanet_3.jpg", badges: ["معربة"], category: "مغامرة" },
            { platform: "PS4", titleAr: "لوني تونز: آكمي أرسنال", titleEn: "Looney Tunes Acme Arsenal", rating: "0.0", downloads: "1,000", size: "غير محدد", image: baseURL + "Looney_Tunes_Acme_Arsenal.jpg", badges: ["معربة"], category: "أكشن" },
            { platform: "PS4", titleAr: "ميدل إيرث: شادو أوف موردور", titleEn: "Middle Earth Shadow of Mordor", rating: "0.0", downloads: "1,000", size: "غير محدد", image: baseURL + "Middle_Earth_Shadow_of_Mordor.jpg", badges: ["معربة"], category: "أكشن" },
            { platform: "PS4", titleAr: "نيفا", titleEn: "Neva", rating: "0.0", downloads: "1,000", size: "غير محدد", image: baseURL + "Neva.jpg", badges: ["معربة"], category: "مغامرة" },
            { platform: "PS4", titleAr: "أومينسايت", titleEn: "Omensight", rating: "0.0", downloads: "1,000", size: "غير محدد", image: baseURL + "Omensight.jpg", badges: ["معربة"], category: "مغامرة" },
            { platform: "PS4", titleAr: "بوبي بلاي تايم 4", titleEn: "Poppy Play Time 4", rating: "0.0", downloads: "1,000", size: "غير محدد", image: baseURL + "Poppy_Playtime_4.jpg", badges: ["معربة"], category: "مغامرة" },
            { platform: "PS4", titleAr: "روينر", titleEn: "Ruiner", rating: "0.0", downloads: "1,000", size: "غير محدد", image: baseURL + "Ruiner.jpg", badges: ["معربة"], category: "أكشن" },
            { platform: "PS4", titleAr: "سينر: ساكريفيس فور ريدمبشن", titleEn: "Sinner Sacrifice for Redemption", rating: "0.0", downloads: "1,000", size: "غير محدد", image: baseURL + "Sinner_Sacrifice_for_Redemption.jpg", badges: ["معربة"], category: "أكشن" },
            { platform: "PS4", titleAr: "سلاحف النينجا: ميوتنت ميلي", titleEn: "Teenage Mutant Ninja Turtles Mutant Melee", rating: "0.0", downloads: "1,000", size: "غير محدد", image: baseURL + "Teenage_Mutant_Ninja_Turtles_Mutant_Melee.jpg", badges: ["معربة"], category: "أكشن" }
        ];

        const container = document.getElementById('gamesContainer');
        const paginationContainer = document.getElementById('pagination');
        const searchInput = document.getElementById('searchInput');
        const modal = document.getElementById('orderModal');
        const gameNameInput = document.getElementById('gameNameInput');
        const phoneNumberInput = document.getElementById('phoneNumber');
        const userMessageInput = document.getElementById('userMessage');

        const itemsPerPage = 10; 
        let currentPage = 1;
        let activeCategory = 'الكل';
        let activePlatform = 'PS4'; 
        let currentSearchQuery = '';
        let currentGamesList = [...gamesData]; 

        function toggleClearBtn() {
            const clearBtn = document.getElementById('clearSearchBtn');
            if (searchInput.value.length > 0) {
                clearBtn.classList.add('visible');
            } else {
                clearBtn.classList.remove('visible');
            }
        }

        function clearSearch() {
            searchInput.value = '';
            document.getElementById('clearSearchBtn').classList.remove('visible');
            filterGames();
            searchInput.focus();
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('sidebarOverlay').classList.toggle('active');
        }

        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            const icon = document.getElementById('themeIcon');
            if (document.body.classList.contains('light-mode')) {
                icon.className = 'fa-solid fa-sun';
                icon.style.color = '#f39c12';
            } else {
                icon.className = 'fa-solid fa-moon';
                icon.style.color = 'var(--primary-color)';
            }
        }

        function filterByPlatform(platform) {
            activePlatform = platform;
            
            document.getElementById('currentPlatformText').innerText = platform === 'الكل' ? 'جميع المنصات' : platform;
            document.getElementById('filterTagText').innerText = platform === 'الكل' ? 'الكل' : platform;

            document.querySelectorAll('.platform-item').forEach(item => item.classList.remove('active'));
            if (platform === 'PS4') {
                document.querySelectorAll('.platform-item')[1].classList.add('active');
            } else if (platform === 'PS3') {
                document.querySelectorAll('.platform-item')[0].classList.add('active');
            }

            if (document.getElementById('sidebar').classList.contains('active')) {
                toggleSidebar();
            }

            applyFilters();
        }

        function getBadgeClass(badgeText) {
            if (badgeText.includes('مدبلجة') && badgeText.includes('معربة')) return 'dubbed'; 
            if (badgeText.includes('مدبلجة') || badgeText.includes('دبلجة')) return 'dubbed';
            if (badgeText.includes('عربية') || badgeText.includes('معربة') || badgeText.includes('ترجمة') || badgeText.includes('تعريب')) return 'arabic';
            return 'translated'; 
        }

        function applyFilters() {
            let filtered = gamesData;

            if (activePlatform !== 'الكل') {
                filtered = filtered.filter(game => game.platform === activePlatform);
            }

            if (activeCategory !== 'الكل') {
                filtered = filtered.filter(game => game.category === activeCategory);
            }

            if (currentSearchQuery !== '') {
                filtered = filtered.filter(game => 
                    game.titleAr.toLowerCase().includes(currentSearchQuery) || 
                    game.titleEn.toLowerCase().includes(currentSearchQuery)
                );
            }

            currentPage = 1; 
            renderGames(filtered);
        }

        function filterByCategory(category, btnElement) {
            activeCategory = category;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            applyFilters();
        }

        function filterGames() {
            currentSearchQuery = searchInput.value.toLowerCase().trim();
            applyFilters();
        }

        function renderGames(gamesToRender) {
            currentGamesList = gamesToRender;
            const totalPages = Math.ceil(gamesToRender.length / itemsPerPage);

            if (currentPage > totalPages) currentPage = totalPages || 1;
            if (currentPage < 1) currentPage = 1;

            const startIndex = (currentPage - 1) * itemsPerPage;
            const paginatedGames = gamesToRender.slice(startIndex, startIndex + itemsPerPage);

            container.innerHTML = '';
            
            if (paginatedGames.length === 0) {
                container.innerHTML = '<div class="empty-state"><i class="fa-solid fa-gamepad fa-3x mb-3"></i><br>لم يتم العثور على ألعاب في هذا القسم</div>';
                paginationContainer.innerHTML = '';
                return;
            }

            paginatedGames.forEach(game => {
                const sizeNumber = parseInt(game.size) || 0;
                
                let calculatedPrice = "";
                
                if (game.titleEn === "Call of Duty: Modern Warfare II + III") {
                    calculatedPrice = "5,000 د.ع";
                } else if (game.titleEn === "Call of Duty: Black Ops III") {
                    calculatedPrice = "3,000 د.ع";
                } else if (game.titleEn === "Call of Duty: Black Ops II") {
                    calculatedPrice = "2,000 د.ع";
                } else if (game.titleEn === "COD Cold War") {
                    calculatedPrice = "4,000 د.ع";
                } else if (sizeNumber >= 100) {
                    calculatedPrice = "3,000 د.ع";
                } else if (sizeNumber > 20) {
                    calculatedPrice = "2,000 د.ع";
                } else {
                    calculatedPrice = "1,000 د.ع";
                }

                const fallbackImage = `https://placehold.co/300x400/1a1a1a/ffffff?text=${encodeURIComponent(game.titleEn)}`;

                let badgesHtml = '';
                if (game.badges && game.badges.length > 0) {
                    badgesHtml = game.badges.map(b => `<span class="badge ${getBadgeClass(b)}">${b}</span>`).join('');
                }

                const youtubeSearchUrl = `https://www.youtube.com/results?search_query=${encodeURIComponent(game.titleEn + ' PS4 gameplay trailer')}`;

                const card = document.createElement('div');
                card.className = 'game-card';
                card.innerHTML = `
                    <div class="game-image">
                        <img src="${game.image}" class="cover" alt="${game.titleEn}" loading="lazy" onerror="this.onerror=null; this.src='${fallbackImage}';">
                        <div class="badges-bottom">${badgesHtml}</div>
                    </div>
                    <div class="game-info">
                        <div class="game-title-container">
                            <span class="title-ar">${game.titleAr}</span>
                            <span class="title-en">${game.titleEn}</span>
                        </div>
                        
                        <div class="game-stats">
                            <span class="downloads"><i class="fa-solid fa-download"></i> ${game.downloads}</span>
                            <span class="rating"><i class="fa-solid fa-star"></i> ${game.rating}</span>
                        </div>

                        <div class="game-price">السعر : ${calculatedPrice}</div>

                        <div class="action-buttons">
                            <button class="btn-add" onclick="openModal('${game.titleAr} (${game.titleEn})', '${game.size}', '${calculatedPrice}')">
                                <i class="fa-solid fa-cart-plus"></i> إضافة
                            </button>
                            
                            <a href="${youtubeSearchUrl}" target="_blank" class="btn-watch" title="شاهد فيديو اللعبة">
                                <i class="fa-brands fa-youtube"></i> شاهد
                            </a>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });

            renderPagination(totalPages);
        }

        function renderPagination(totalPages) {
            paginationContainer.innerHTML = '';
            if (totalPages <= 1) return;

            const prevBtn = document.createElement('button');
            prevBtn.className = 'page-btn';
            prevBtn.innerHTML = '<i class="fa-solid fa-chevron-right"></i> السابق';
            prevBtn.disabled = currentPage === 1;
            prevBtn.onclick = () => changePage(currentPage - 1);
            paginationContainer.appendChild(prevBtn);

            for (let i = 1; i <= totalPages; i++) {
                const pageBtn = document.createElement('button');
                pageBtn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
                pageBtn.innerText = i;
                pageBtn.onclick = () => changePage(i);
                paginationContainer.appendChild(pageBtn);
            }

            const nextBtn = document.createElement('button');
            nextBtn.className = 'page-btn';
            nextBtn.innerHTML = 'التالي <i class="fa-solid fa-chevron-left"></i>';
            nextBtn.disabled = currentPage === totalPages;
            nextBtn.onclick = () => changePage(currentPage + 1);
            paginationContainer.appendChild(nextBtn);
        }

        function changePage(page) {
            currentPage = page;
            renderGames(currentGamesList);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function openModal(gameTitle, gameSize, gamePrice) {
            gameNameInput.value = `${gameTitle} | الحجم: ${gameSize} | السعر: ${gamePrice}`;
            modal.classList.add('active');
            phoneNumberInput.value = '';
            userMessageInput.value = 'أريد طلب هذه اللعبة من فضلك';
            setTimeout(() => phoneNumberInput.focus(), 100);
        }

        function closeModal() { modal.classList.remove('active'); }
        modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

        function sendToWhatsApp(event) {
            event.preventDefault();
            const gameName = gameNameInput.value;
            const userMessage = userMessageInput.value;
            const phoneNumber = phoneNumberInput.value;

            if (!phoneNumber || !userMessage) {
                alert('يرجى تعبئة جميع الحقول!');
                return;
            }

            const myWhatsAppNumber = "9647712082333"; 
            const message = `مرحباً، لدي طلب لعبة:\n\n🎮 *تفاصيل اللعبة:* ${gameName}\n💬 *الرسالة:* ${userMessage}\n📱 *رقم الهاتف:* ${phoneNumber}`;
            window.open(`https://wa.me/${myWhatsAppNumber}?text=${encodeURIComponent(message)}`, '_blank');
            closeModal();
        }

        window.onload = () => {
            applyFilters(); 
        };
    </script>
</body>
</html>
