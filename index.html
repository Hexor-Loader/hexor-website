<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ألعاب PS4 المعربة - مكتب العراب</title>
    <!-- استدعاء خط Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- استدعاء أيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1a1a1a;
            --text-color: #ffffff;
            --text-muted: #a0a0a0;
            --primary-color: #2ecc71;
            --accent-color: #3498db;
            --danger-color: #e74c3c;
            --warning-color: #f39c12;
            --price-color: #f1c40f;
            --ps-blue: #0070d1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 50px;
        }

        /* =========================================
           الشريط العلوي (Top Navbar)
           ========================================= */
        .top-navbar {
            background-color: #111;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid #222;
        }

        .nav-right, .nav-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-btn {
            background-color: #222;
            color: #fff;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
        }

        .nav-btn.text-btn {
            width: auto;
            padding: 0 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--primary-color);
            font-weight: bold;
            font-size: 18px;
        }

        .nav-logo i { font-size: 22px; }

        /* =========================================
           مسار التنقل (Breadcrumb) والمنصات
           ========================================= */
        .sub-nav {
            padding: 15px;
            background-color: var(--bg-color);
        }

        .breadcrumb {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 15px;
        }

        .breadcrumb span { color: #fff; }

        .platforms-scroll {
            display: flex;
            gap: 25px;
            overflow-x: auto;
            padding-bottom: 10px;
            scrollbar-width: none;
            justify-content: flex-end;
        }
        .platforms-scroll::-webkit-scrollbar { display: none; }

        .platform-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            color: var(--text-muted);
            font-size: 13px;
            min-width: 60px;
            cursor: pointer;
        }

        .platform-item i { font-size: 26px; }

        .platform-item.active {
            color: #fff;
            position: relative;
        }

        .platform-item.active::after {
            content: '';
            position: absolute;
            bottom: -10px;
            width: 100%;
            height: 3px;
            background-color: var(--ps-blue);
            border-radius: 3px;
        }

        /* =========================================
           البانر الرئيسي (Hero Banner) مع الخلفية
           ========================================= */
        .hero-banner {
            margin: 10px 15px;
            height: 180px;
            border-radius: 15px;
            background: linear-gradient(to bottom, rgba(15, 15, 15, 0.7), rgba(15, 15, 15, 0.9)), url('https://raw.githubusercontent.com/Hexor-Loader/hexor-website/refs/heads/main/icon/file_0000000026e88246a1a01e8bbf72e773.png') center/cover;
            position: relative;
            display: flex;
            align-items: flex-end;
            padding: 15px;
            border: 1px solid #333;
        }

        .hero-search {
            display: flex;
            width: 100%;
            background: rgba(30, 30, 30, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            overflow: hidden;
            border: 1px solid #444;
        }

        .hero-search input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 12px 20px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        .hero-search button {
            background-color: var(--primary-color);
            color: #111;
            border: none;
            padding: 0 25px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            border-radius: 30px;
            margin: 4px;
        }

        /* معلومات مكتب العراب */
        .shop-info-bar {
            margin: 15px;
            background: var(--card-bg);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-size: 13px;
            color: var(--text-muted);
        }
        .shop-info-bar span { display: flex; align-items: center; gap: 8px; }
        .shop-info-bar .shop-name { color: #fff; font-weight: bold; font-size: 15px; }
        .shop-info-bar i { width: 16px; text-align: center; }
        .shop-info-bar .shop-phone a { color: var(--primary-color); text-decoration: none; font-weight: bold; }

        /* =========================================
           شريط الفلاتر (Filter Bar)
           ========================================= */
        .filter-bar {
            margin: 20px 15px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }
        
        .filter-bar-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .filter-tag {
            background-color: rgba(46, 204, 113, 0.1);
            color: var(--primary-color);
            border: 1px solid var(--primary-color);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }

        /* =========================================
           شبكة الألعاب (Games Grid)
           ========================================= */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 15px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
        }

        .game-card {
            background-color: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            border: 1px solid #222;
        }

        .game-image {
            width: 100%;
            aspect-ratio: 3 / 4;
            background: #2a2a2a;
            position: relative;
        }

        /* الشريط الأزرق لـ PS4 أعلى الصورة */
        .ps4-top-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            background-color: var(--ps-blue);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2px 8px;
            z-index: 5;
            font-size: 12px;
            font-weight: bold;
        }

        .game-image img.cover {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            padding-top: 20px;
        }

        /* تنسيق شارات الترجمة */
        .badges-bottom {
            position: absolute;
            bottom: 8px;
            left: 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            z-index: 10;
        }

        .badge {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
            color: white;
        }

        /* ألوان شارات الترجمة */
        .badge.translated { background-color: #9b59b6; } /* بنفسجي */
        .badge.arabic { background-color: #2980b9; } /* أزرق */
        .badge.dubbed { background-color: #e74c3c; } /* أحمر */

        .game-info {
            padding: 10px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        /* تعديل حاوية العنوان لدعم سطرين */
        .game-title-container {
            height: 42px; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-bottom: 8px;
            text-align: center;
        }

        .title-ar {
            font-size: 13px;
            font-weight: 700;
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        .title-en {
            font-size: 11px;
            color: var(--text-muted);
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        /* تنسيق صف الإحصائيات */
        .game-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .game-stats span { display: flex; align-items: center; gap: 4px; }
        .rating i { color: var(--warning-color); }

        /* تنسيق السعر */
        .game-price {
            font-size: 14px;
            font-weight: bold;
            color: var(--price-color);
            margin-bottom: 10px;
            text-align: center;
            background: rgba(241, 196, 15, 0.1);
            padding: 6px;
            border-radius: 6px;
            border: 1px dashed rgba(241, 196, 15, 0.3);
        }

        .btn-add {
            margin-top: auto;
            background-color: var(--primary-color);
            color: #111;
            border: none;
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: 0.3s;
        }

        .btn-add:hover { background-color: #27ae60; color: #fff; }

        /* =========================================
           الترقيم (Pagination)
           ========================================= */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin: 30px auto;
            padding: 0 10px;
            flex-wrap: wrap;
        }

        .page-btn {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid #333;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 40px;
        }

        .page-btn:hover:not(:disabled) { background-color: #333; }
        .page-btn.active { background-color: var(--primary-color); color: #111; border-color: var(--primary-color); }
        .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            backdrop-filter: blur(4px);
        }

        .modal-overlay.active { display: flex; }

        .modal-content {
            background-color: var(--card-bg);
            width: 90%;
            max-width: 400px;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #333;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        .modal-header h2 { font-size: 18px; color: var(--primary-color); }
        .btn-close { background: none; border: none; color: var(--text-muted); font-size: 22px; cursor: pointer; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 13px; }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #444;
            background-color: #222;
            color: #fff;
            font-size: 14px;
        }
        .form-group input[readonly] { background-color: #111; color: var(--text-muted); }
        
        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #25D366;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px;
            color: var(--text-muted);
        }
    </style>
</head>

    <!-- Modal -->

            </div>

                    <label>تفاصيل اللعبة</label>
                    <input type="text" id="gameNameInput" readonly>
                </div>
                <div class="form-group">
                    <label>الرسالة</label>

                    <label>رقم الهاتف</label>

                <button type="submit" class="btn-submit">

            { titleAr: "القتيل: الروح المشتبه بها", titleEn: "Murdered: Soul Suspect", rating: "0.0", downloads: "1,337", size: "18 GB", image: baseURL + "murdered_soul_suspect.jpg", badges: ["معربة"] },
            { titleAr: "ماديسون", titleEn: "MADiSON", rating: "4.0", downloads: "3,345", size: "22 GB", image: baseURL + "madison.jpg", badges: ["معربة"] },
            { titleAr: "تائه في راندوم", titleEn: "Lost in Random", rating: "1.5", downloads: "2,288", size: "22 GB", image: baseURL + "lost_in_random.jpg", badges: ["معربة"] },
            { titleAr: "مثل التنين: ايشين", titleEn: "Like a Dragon: Ishin!", rating: "4.7", downloads: "2,446", size: "60 GB", image: baseURL + "like_a_dragon_ishin.jpg", badges: ["معربة"] },
            { titleAr: "المعرفة قوة", titleEn: "Knowledge is Power", rating: "0.0", downloads: "1,393", size: "8 GB", image: baseURL + "knowledge_is_power.jpg", badges: ["معربة"] },
            { titleAr: "كينغدوم كوم: الخلاص", titleEn: "Kingdom Come: Deliverance", rating: "4.8", downloads: "4,567", size: "55 GB", image: baseURL + "kingdom_come_deliverance.jpg", badges: ["معربة"] },
            { titleAr: "قاتل محترف", titleEn: "Hitman", rating: "4.5", downloads: "35,356", size: "45 GB", image: baseURL + "hitman.jpg", badges: ["قوائم فقط"] },
            { titleAr: "الجرينش: مغامرات عيد الميلاد", titleEn: "The Grinch: Christmas Adventures", rating: "0.0", downloads: "359", size: "6 GB", image: baseURL + "grinch_christmas_adventures.jpg", badges: ["معربة"] },
            { titleAr: "فار: المد المتغير", titleEn: "Far: Changing Tides", rating: "0.0", downloads: "1,228", size: "8 GB", image: baseURL + "far_changing_tides.jpg", badges: ["معربة"] },
            { titleAr: "جيلت", titleEn: "Gylt", rating: "0.0", downloads: "2,605", size: "15 GB", image: baseURL + "gylt.jpg", badges: ["معربة"] },
            { titleAr: "دمر كل البشر: مجزرة المستنسخين", titleEn: "Destroy All Humans! Clone Carnage", rating: "4.5", downloads: "1,016", size: "20 GB", image: baseURL + "destroy_all_humans_clone_carnage.jpg", badges: ["معربة"] },
            { titleAr: "إيكاي", titleEn: "Ikai", rating: "5.0", downloads: "1,009", size: "10 GB", image: baseURL + "ikai.jpg", badges: ["معربة"] },
            { titleAr: "رأيت سحبا سوداء", titleEn: "I Saw Black Clouds", rating: "0.0", downloads: "909", size: "12 GB", image: baseURL + "i_saw_black_clouds.jpg", badges: ["معربة"] }
        ];

        const container = document.getElementById('gamesContainer');
        const paginationContainer = document.getElementById('pagination');
        const searchInput = document.getElementById('searchInput');
        const modal = document.getElementById('orderModal');
        const gameNameInput = document.getElementById('gameNameInput');
        const phoneNumberInput = document.getElementById('phoneNumber');
        const userMessageInput = document.getElementById('userMessage');

        const itemsPerPage = 10; 
        let currentPage = 1;
        let currentGamesList = [...gamesData]; 

        function getBadgeClass(badgeText) {
            if (badgeText.includes('مدبلجة') && badgeText.includes('معربة')) return 'dubbed'; 
            if (badgeText.includes('مدبلجة')) return 'dubbed';
            if (badgeText.includes('عربية') || badgeText.includes('معربة')) return 'arabic';
            return 'translated'; 
        }

        function renderGames(gamesToRender) {
            currentGamesList = gamesToRender;
            const totalPages = Math.ceil(gamesToRender.length / itemsPerPage);

            if (currentPage > totalPages) currentPage = totalPages || 1;
            if (currentPage < 1) currentPage = 1;

            const startIndex = (currentPage - 1) * itemsPerPage;
            const paginatedGames = gamesToRender.slice(startIndex, startIndex + itemsPerPage);

            container.innerHTML = '';
            
            if (paginatedGames.length === 0) {
                container.innerHTML = '<div class="empty-state"><i class="fa-solid fa-gamepad fa-3x mb-3"></i><br>لم يتم العثور على ألعاب</div>';
                paginationContainer.innerHTML = '';
                return;
            }

            paginatedGames.forEach(game => {
                const sizeNumber = parseInt(game.size) || 0;
                let calculatedPrice = sizeNumber > 20 ? "2,000 د.ع" : "1,000 د.ع";

                const fallbackImage = `https://placehold.co/300x400/1a1a1a/ffffff?text=${encodeURIComponent(game.titleEn)}`;

                let badgesHtml = '';
                if (game.badges && game.badges.length > 0) {
                    badgesHtml = game.badges.map(b => `<span class="badge ${getBadgeClass(b)}">${b}</span>`).join('');
                }

                const card = document.createElement('div');
                card.className = 'game-card';
                card.innerHTML = `
                    <div class="game-image">
                        <div class="ps4-top-bar">
                            <i class="fa-brands fa-playstation"></i>
                            <span>PS4</span>
                        </div>
                        
                        <img src="${game.image}" class="cover" alt="${game.titleEn}" loading="lazy" onerror="this.onerror=null; this.src='${fallbackImage}';">
                        
                        <div class="badges-bottom">${badgesHtml}</div>
                    </div>
                    <div class="game-info">
                        <div class="game-title-container">
                            <span class="title-ar">${game.titleAr}</span>
                            <span class="title-en">${game.titleEn}</span>
                        </div>
                        
                        <div class="game-stats">
                            <span class="downloads"><i class="fa-solid fa-download"></i> ${game.downloads}</span>
                            <span class="rating"><i class="fa-solid fa-star"></i> ${game.rating}</span>
                        </div>

                        <div class="game-price">السعر : ${calculatedPrice}</div>

                        <button class="btn-add" onclick="openModal('${game.titleAr} (${game.titleEn})', '${game.size}', '${calculatedPrice}')">
                            <i class="fa-solid fa-cart-plus"></i> إضافة (طلب)
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });

            renderPagination(totalPages);
        }

        function renderPagination(totalPages) {
            paginationContainer.innerHTML = '';
            if (totalPages <= 1) return;

            const prevBtn = document.createElement('button');
            prevBtn.className = 'page-btn';
            prevBtn.innerHTML = '<i class="fa-solid fa-chevron-right"></i> السابق';
            prevBtn.disabled = currentPage === 1;
            prevBtn.onclick = () => changePage(currentPage - 1);
            paginationContainer.appendChild(prevBtn);

            for (let i = 1; i <= totalPages; i++) {
                const pageBtn = document.createElement('button');
                pageBtn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
                pageBtn.innerText = i;
                pageBtn.onclick = () => changePage(i);
                paginationContainer.appendChild(pageBtn);
            }

            const nextBtn = document.createElement('button');
            nextBtn.className = 'page-btn';
            nextBtn.innerHTML = 'التالي <i class="fa-solid fa-chevron-left"></i>';
            nextBtn.disabled = currentPage === totalPages;
            nextBtn.onclick = () => changePage(currentPage + 1);
            paginationContainer.appendChild(nextBtn);
        }

        function changePage(page) {
            currentPage = page;
            renderGames(currentGamesList);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function filterGames() {
            const searchTerm = searchInput.value.toLowerCase();
            const filteredGames = gamesData.filter(game => 
                game.titleAr.toLowerCase().includes(searchTerm) || 
                game.titleEn.toLowerCase().includes(searchTerm)
            );
            currentPage = 1;
            renderGames(filteredGames);
        }

        function openModal(gameTitle, gameSize, gamePrice) {
            gameNameInput.value = `${gameTitle} | الحجم: ${gameSize} | السعر: ${gamePrice}`;
            modal.classList.add('active');
            phoneNumberInput.value = '';
            userMessageInput.value = 'أريد طلب هذه اللعبة من فضلك';
            setTimeout(() => phoneNumberInput.focus(), 100);
        }

        function closeModal() { modal.classList.remove('active'); }
        modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

        function sendToWhatsApp(event) {
            event.preventDefault();
            const gameName = gameNameInput.value;
            const userMessage = userMessageInput.value;
            const phoneNumber = phoneNumberInput.value;

            if (!phoneNumber || !userMessage) {
                alert('يرجى تعبئة جميع الحقول!');
                return;
            }

            const myWhatsAppNumber = "9647712082333"; 
            const message = `مرحباً، لدي طلب لعبة:\n\n🎮 *تفاصيل اللعبة:* ${gameName}\n💬 *الرسالة:* ${userMessage}\n📱 *رقم الهاتف:* ${phoneNumber}`;
            window.open(`https://wa.me/${myWhatsAppNumber}?text=${encodeURIComponent(message)}`, '_blank');
            closeModal();
        }

        window.onload = () => {
            renderGames(gamesData);
        };
    </script>
</body>
</html>
