<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ألعاب PS4 المعربة</title>
    <!-- استدعاء خط Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- استدعاء أيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1a1a1a;
            --text-color: #ffffff;
            --text-muted: #a0a0a0;
            --primary-color: #2ecc71;
            --accent-color: #3498db;
            --danger-color: #e74c3c;
            --warning-color: #f39c12;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 50px;
        }

        /* Header & Search */
        header {
            background-color: #111;
            padding: 15px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-area h1 {
            font-size: 20px;
            color: var(--primary-color);
        }

        .search-container {
            width: 100%;
            max-width: 600px;
            position: relative;
        }

        .search-container input {
            width: 100%;
            padding: 12px 40px 12px 15px;
            border-radius: 8px;
            border: 1px solid #333;
            background-color: var(--card-bg);
            color: var(--text-color);
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        .search-container input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 8px rgba(46, 204, 113, 0.3);
        }

        .search-container i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        /* Games Grid */
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 10px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
        }

        /* Game Card */
        .game-card {
            background-color: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
            display: flex;
            flex-direction: column;
            border: 1px solid #222;
        }

        .game-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.6);
        }

        .game-image {
            width: 100%;
            aspect-ratio: 3 / 4;
            background: #2a2a2a;
            position: relative;
        }

        .game-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .badges {
            position: absolute;
            top: 8px;
            right: 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            z-index: 10;
        }

        .badge {
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            color: white;
        }

        .badge.new { background-color: var(--danger-color); }
        .badge.popular { background-color: var(--warning-color); }
        .badge.translated { background-color: #9b59b6; }
        .badge.arabic { background-color: #2980b9; }

        .game-info {
            padding: 10px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .game-title {
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 8px;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            height: 36px; 
        }

        .game-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 11px;
            color: var(--text-muted);
        }

        .rating i { color: var(--warning-color); }

        .btn-add {
            margin-top: auto;
            background-color: var(--primary-color);
            color: #111;
            border: none;
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: 0.3s;
        }

        .btn-add:hover {
            background-color: #27ae60;
            color: #fff;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background-color: var(--card-bg);
            width: 90%;
            max-width: 400px;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 1px solid #333;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        .modal-header h2 {
            font-size: 18px;
            color: var(--primary-color);
        }

        .btn-close {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 22px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-close:hover {
            color: var(--danger-color);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: var(--text-color);
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #444;
            background-color: #222;
            color: #fff;
            font-size: 14px;
            font-family: inherit;
        }

        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .form-group input[readonly] {
            background-color: #111;
            color: var(--text-muted);
            cursor: not-allowed;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #25D366;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #128C7E;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px;
            color: var(--text-muted);
            font-size: 16px;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo-area">
            <i class="fa-brands fa-playstation fa-2x" style="color: #0070d1;"></i>
            <h1>PS4 الألعاب المعربة</h1>
        </div>
        <div class="search-container">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="ابحث عن لعبة..." onkeyup="filterGames()">
        </div>
    </header>

    <!-- Games Grid -->
    <div class="container" id="gamesContainer">
        <!-- سيتم حقن الألعاب هنا -->
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="orderModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>طلب اللعبة</h2>
                <button class="btn-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <form id="orderForm" onsubmit="sendToWhatsApp(event)">
                <div class="form-group">
                    <label for="gameNameInput">اسم اللعبة</label>
                    <input type="text" id="gameNameInput" readonly>
                </div>
                
                <div class="form-group">
                    <label for="userMessage">الرسالة</label>
                    <textarea id="userMessage" rows="2" required>أريد هذه اللعبة من فضلك</textarea>
                </div>

                <div class="form-group">
                    <label for="phoneNumber">رقم الهاتف</label>
                    <input type="tel" id="phoneNumber" placeholder="مثال: 077XXXXXXXX" required>
                </div>

                <button type="submit" class="btn-submit">
                    <i class="fa-brands fa-whatsapp fa-lg"></i>
                    إرسال الطلب عبر واتساب
                </button>
            </form>
        </div>
    </div>

    <script>
        // ⚠️ رابط مجلد الصور في مستودعك على جيت هاب
        const baseURL = "https://raw.githubusercontent.com/Hexor-Loader/hexor-website/main/images/";

        /* 
           قائمة الألعاب - تم ربطها بأسماء الصور التي قمت بتجهيزها
           إذا أردت استخدام الصور محلياً (من استضافتك)، يمكنك إزالة baseURL 
           ووضع المسار هكذا: image: "images/mirage.jpg"
        */
        const gamesData = [
            { title: "عقيدة الأساسنز: السراب (AC Mirage)", rating: "4.3", downloads: "110,721", image: baseURL + "mirage.jpg", badges: ["جديدة", "شائعة", "مترجمة"] },
            { title: "واتش دوغز (Watch Dogs)", rating: "4.4", downloads: "1,779", image: baseURL + "watchdogs.jpg", badges: ["جديدة", "شائعة", "قوائم عربية"] },
            { title: "هيتمان 3 (Hitman 3)", rating: "4.7", downloads: "3,492", image: baseURL + "hitman3.jpg", badges: ["جديدة", "شائعة", "قوائم عربية"] },
            { title: "نداء الواجب: الحرب الباردة (COD)", rating: "4.3", downloads: "19,782", image: baseURL + "cod.jpg", badges: ["شائعة", "مترجمة"] },
            { title: "تحت الأمواج (Under The Waves)", rating: "3.7", downloads: "3,478", image: baseURL + "underwaves.jpg", badges: ["شائعة", "مترجمة"] },
            { title: "بندي وآلة الحبر (Bendy)", rating: "5.0", downloads: "913", image: baseURL + "bendy.jpg", badges: ["شائعة", "قوائم عربية"] },
            { title: "توي ستوري 3 (Toy Story 3)", rating: "5.0", downloads: "3,298", image: baseURL + "toystory.jpg", badges: ["شائعة", "قوائم عربية"] },
            { title: "دراغون بول زد كاكاروت (Dragon Ball Z)", rating: "4.6", downloads: "18,583", image: baseURL + "dragonball.jpg", badges: ["شائعة", "مترجمة"] },
            { title: "مارفل أفنجرز (Marvel's Avengers)", rating: "3.6", downloads: "12,450", image: baseURL + "avengers.jpg", badges: ["شائعة", "مدبلجة ومترجمة"] },
            { title: "كينا: جسر الأرواح (Kena)", rating: "3.7", downloads: "10,232", image: baseURL + "kena.jpg", badges: ["شائعة", "ترجمة قوائم"] },
            { title: "غوست تسوشيما (Ghost of Tsushima)", rating: "4.3", downloads: "82,551", image: baseURL + "ghost.jpg", badges: ["شائعة", "مترجمة"] },
            { title: "الكوابيس الصغيرة (Little Nightmares)", rating: "4.1", downloads: "32,966", image: baseURL + "littlenightmares.jpg", badges: ["شائعة", "معربة"] },
            { title: "الكوابيس الصغيرة 2 (Little Nightmares 2)", rating: "4.3", downloads: "23,967", image: baseURL + "littlenightmares2.jpg", badges: ["شائعة", "مترجمة"] },
            { title: "الكوابيس الصغيرة 3 (Little Nightmares 3)", rating: "4.0", downloads: "24,214", image: baseURL + "littlenightmares3.jpg", badges: ["شائعة", "مترجمة"] },
            { title: "مافيا النسخة النهائية (Mafia)", rating: "3.7", downloads: "31,739", image: baseURL + "mafia.jpg", badges: ["شائعة", "مترجمة"] },
            { title: "مافيا 2 (Mafia II)", rating: "4.3", downloads: "16,237", image: baseURL + "mafia2.jpg", badges: ["شائعة", "مترجمة"] },
            { title: "ضال (Stray)", rating: "4.3", downloads: "32,584", image: baseURL + "stray.jpg", badges: ["شائعة", "معربة"] },
            { title: "تيكن 7 (Tekken 7)", rating: "4.5", downloads: "18,000", image: baseURL + "tekken7.jpg", badges: ["شائعة", "معربة"] },
            { title: "ذا إلدر سكرولز 5: سكايريم (Skyrim)", rating: "3.2", downloads: "5,485", image: baseURL + "skyrim.jpg", badges: ["شائعة", "مترجمة"] },
            { title: "داركسايدرز 3 (Darksiders 3)", rating: "1.8", downloads: "2,567", image: baseURL + "darksiders3.jpg", badges: ["شائعة", "مترجمة"] }
        ];

        const container = document.getElementById('gamesContainer');
        const searchInput = document.getElementById('searchInput');
        const modal = document.getElementById('orderModal');
        const gameNameInput = document.getElementById('gameNameInput');
        const phoneNumberInput = document.getElementById('phoneNumber');
        const userMessageInput = document.getElementById('userMessage');

        // دالة عرض الألعاب
        function renderGames(games) {
            container.innerHTML = '';
            
            if (games.length === 0) {
                container.innerHTML = '<div class="empty-state"><i class="fa-solid fa-gamepad fa-3x mb-3" style="margin-bottom:10px;"></i><br>لم يتم العثور على ألعاب مطابقة</div>';
                return;
            }

            games.forEach(game => {
                let badgesHtml = '';
                game.badges.forEach(badge => {
                    let badgeClass = 'new';
                    if (badge === 'شائعة') badgeClass = 'popular';
                    if (badge === 'مترجمة') badgeClass = 'translated';
                    if (badge.includes('عربية')) badgeClass = 'arabic';
                    badgesHtml += `<span class="badge ${badgeClass}">${badge}</span>`;
                });

                // صورة بديلة أنيقة في حال لم يتم العثور على الصورة (تظهر اسم اللعبة)
                const fallbackImage = `https://placehold.co/300x400/1a1a1a/ffffff?text=${encodeURIComponent(game.title)}`;

                const card = document.createElement('div');
                card.className = 'game-card';
                card.innerHTML = `
                    <div class="game-image">
                        <img src="${game.image}" alt="${game.title}" loading="lazy" onerror="this.onerror=null; this.src='${fallbackImage}';">
                        <div class="badges">${badgesHtml}</div>
                    </div>
                    <div class="game-info">
                        <h3 class="game-title">${game.title}</h3>
                        <div class="game-stats">
                            <span class="rating"><i class="fa-solid fa-star"></i> ${game.rating}</span>
                            <span class="downloads"><i class="fa-solid fa-download"></i> ${game.downloads}</span>
                        </div>
                        <button class="btn-add" onclick="openModal('${game.title.replace(/'/g, "\\'")}')">
                            <i class="fa-solid fa-cart-plus"></i> إضافة (طلب)
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // تصفية الألعاب
        function filterGames() {
            const searchTerm = searchInput.value.toLowerCase();
            const filteredGames = gamesData.filter(game => 
                game.title.toLowerCase().includes(searchTerm)
            );
            renderGames(filteredGames);
        }

        // فتح نافذة الطلب
        function openModal(gameTitle) {
            gameNameInput.value = gameTitle;
            modal.classList.add('active');
            phoneNumberInput.value = '';
            userMessageInput.value = 'أريد هذه اللعبة من فضلك';
            setTimeout(() => phoneNumberInput.focus(), 100);
        }

        // إغلاق النافذة
        function closeModal() {
            modal.classList.remove('active');
        }

        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });

        // إرسال طلب إلى الواتساب
        function sendToWhatsApp(event) {
            event.preventDefault();

            const gameName = gameNameInput.value;
            const userMessage = userMessageInput.value;
            const phoneNumber = phoneNumberInput.value;

            if (!phoneNumber || !userMessage) {
                alert('يرجى تعبئة جميع الحقول!');
                return;
            }

            // ⚠️ رقم الواتساب الخاص بك (بصيغة دولية)
            const myWhatsAppNumber = "9647712082333"; 

            const message = `مرحباً، لدي طلب لعبة:\n\n` +
                            `🎮 *اسم اللعبة:* ${gameName}\n` +
                            `💬 *الرسالة:* ${userMessage}\n` +
                            `📱 *رقم الهاتف:* ${phoneNumber}`;

            const encodedMessage = encodeURIComponent(message);
            const whatsappUrl = `https://wa.me/${myWhatsAppNumber}?text=${encodedMessage}`;

            window.open(whatsappUrl, '_blank');
            closeModal();
        }

        // تشغيل الصفحة
        window.onload = () => {
            renderGames(gamesData);
        };
    </script>
</body>
</html>
