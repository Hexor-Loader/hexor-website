<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ألعاب PS4 المعربة</title>
    <!-- استدعاء خط Cairo من جوجل -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- استدعاء أيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1a1a1a;
            --text-color: #ffffff;
            --text-muted: #a0a0a0;
            --primary-color: #2ecc71;
            --accent-color: #3498db;
            --danger-color: #e74c3c;
            --warning-color: #f39c12;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 50px;
        }

        /* Header & Search */
        header {
            background-color: #111;
            padding: 15px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-area h1 {
            font-size: 24px;
            color: var(--primary-color);
        }

        .search-container {
            width: 100%;
            max-width: 600px;
            position: relative;
        }

        .search-container input {
            width: 100%;
            padding: 12px 40px 12px 15px;
            border-radius: 8px;
            border: 1px solid #333;
            background-color: var(--card-bg);
            color: var(--text-color);
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        .search-container input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 8px rgba(46, 204, 113, 0.3);
        }

        .search-container i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        /* Games Grid */
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        /* Game Card */
        .game-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .game-image {
            width: 100%;
            height: 250px;
            background: linear-gradient(45deg, #2a2a2a, #1a1a1a);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #444;
        }

        .game-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .badges {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            z-index: 10;
        }

        .badge {
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: bold;
            color: white;
        }

        .badge.new { background-color: var(--danger-color); }
        .badge.popular { background-color: var(--warning-color); }
        .badge.translated { background-color: #9b59b6; }

        .game-info {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .game-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .game-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .rating i { color: var(--warning-color); }

        .btn-add {
            margin-top: auto;
            background-color: var(--primary-color);
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.3s;
        }

        .btn-add:hover {
            background-color: #27ae60;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background-color: var(--card-bg);
            width: 90%;
            max-width: 400px;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 1px solid #333;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        .modal-header h2 {
            font-size: 20px;
            color: var(--primary-color);
        }

        .btn-close {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 24px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-close:hover {
            color: var(--danger-color);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: var(--text-color);
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #444;
            background-color: #222;
            color: #fff;
            font-size: 14px;
            font-family: inherit;
        }

        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .form-group input[readonly] {
            background-color: #111;
            color: var(--text-muted);
            cursor: not-allowed;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #25D366; /* WhatsApp Color */
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #128C7E;
        }

        /* Empty State */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px;
            color: var(--text-muted);
            font-size: 18px;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo-area">
            <i class="fa-brands fa-playstation fa-2x" style="color: #0070d1;"></i>
            <h1>PS4 الألعاب المعربة</h1>
        </div>
        <div class="search-container">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="ابحث عن لعبة... (مثال: Watch Dogs)" onkeyup="filterGames()">
        </div>
    </header>

    <!-- Games Grid -->
    <div class="container" id="gamesContainer">
        <!-- سيتم حقن الألعاب هنا بواسطة الجافاسكريبت -->
    </div>

    <!-- Modal (نافذة الطلب) -->
    <div class="modal-overlay" id="orderModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>طلب اللعبة</h2>
                <button class="btn-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <form id="orderForm" onsubmit="sendToWhatsApp(event)">
                <div class="form-group">
                    <label for="gameNameInput">اسم اللعبة</label>
                    <!-- الحقل الأول: اسم اللعبة (يتم تعبئته تلقائياً) -->
                    <input type="text" id="gameNameInput" readonly>
                </div>
                
                <div class="form-group">
                    <label for="userMessage">الرسالة (نص يكتبه الشخص)</label>
                    <!-- الحقل الثاني: نص يكتبه الشخص -->
                    <textarea id="userMessage" rows="2" placeholder="مثال: أريد هذه اللعبة من فضلك" required>أريد هذه اللعبة من فضلك</textarea>
                </div>

                <div class="form-group">
                    <label for="phoneNumber">رقم الهاتف</label>
                    <!-- الحقل الثالث: رقم الهاتف -->
                    <input type="tel" id="phoneNumber" placeholder="مثال: 077XXXXXXXX" required>
                </div>

                <button type="submit" class="btn-submit">
                    <i class="fa-brands fa-whatsapp fa-lg"></i>
                    إرسال الطلب عبر واتساب
                </button>
            </form>
        </div>
    </div>

    <script>
        // قائمة الألعاب (يمكنك إضافة المزيد هنا)
        const gamesData = [
            { title: "Assassins Creed Mirage", rating: "4.3", downloads: "110,721", image: "", badges: ["جديدة", "شائعة", "مترجمة"] },
            { title: "Watch Dogs", rating: "4.4", downloads: "1,779", image: "", badges: ["جديدة", "شائعة", "قوائم عربية"] },
            { title: "Call of Duty Black Ops Cold War", rating: "4.3", downloads: "19,782", image: "", badges: ["شائعة", "مترجمة"] },
            { title: "Ghost of Tsushima Directors Cut", rating: "4.3", downloads: "82,551", image: "", badges: ["شائعة", "مترجمة"] },
            { title: "Red Dead Redemption 2", rating: "4.4", downloads: "269,521", image: "", badges: ["شائعة", "معربة"] },
            { title: "The last of us Remastered", rating: "4.4", downloads: "145,438", image: "", badges: ["شائعة"] },
            { title: "EA Sports FC 27", rating: "4.3", downloads: "144,911", image: "", badges: ["شائعة"] },
            { title: "Little Nightmares 2", rating: "4.3", downloads: "23,967", image: "", badges: ["شائعة", "مترجمة"] },
            { title: "Mafia Definitive Edition", rating: "3.7", downloads: "31,739", image: "", badges: ["شائعة", "مترجمة"] },
            { title: "Stray", rating: "4.3", downloads: "32,584", image: "", badges: ["شائعة", "معربة"] }
        ];

        const container = document.getElementById('gamesContainer');
        const searchInput = document.getElementById('searchInput');
        const modal = document.getElementById('orderModal');
        const gameNameInput = document.getElementById('gameNameInput');
        const phoneNumberInput = document.getElementById('phoneNumber');
        const userMessageInput = document.getElementById('userMessage');

        // دالة لعرض الألعاب
        function renderGames(games) {
            container.innerHTML = '';
            
            if (games.length === 0) {
                container.innerHTML = '<div class="empty-state"><i class="fa-solid fa-gamepad fa-3x mb-3"></i><br>لم يتم العثور على ألعاب مطابقة للبحث</div>';
                return;
            }

            games.forEach(game => {
                // إنشاء شارات (Badges)
                let badgesHtml = '';
                game.badges.forEach(badge => {
                    let badgeClass = 'new';
                    if (badge === 'شائعة') badgeClass = 'popular';
                    if (badge === 'مترجمة' || badge.includes('عربية')) badgeClass = 'translated';
                    badgesHtml += `<span class="badge ${badgeClass}">${badge}</span>`;
                });

                // في حال عدم وجود صورة، نستخدم صورة افتراضية
                let imgUrl = game.image || `https://via.placeholder.com/300x400/2a2a2a/ffffff?text=${encodeURIComponent(game.title)}`;

                const card = document.createElement('div');
                card.className = 'game-card';
                card.innerHTML = `
                    <div class="game-image">
                        <img src="${imgUrl}" alt="${game.title}" loading="lazy">
                        <div class="badges">${badgesHtml}</div>
                    </div>
                    <div class="game-info">
                        <h3 class="game-title" title="${game.title}">${game.title}</h3>
                        <div class="game-stats">
                            <span class="rating"><i class="fa-solid fa-star"></i> ${game.rating}</span>
                            <span class="downloads"><i class="fa-solid fa-download"></i> ${game.downloads}</span>
                        </div>
                        <button class="btn-add" onclick="openModal('${game.title.replace(/'/g, "\\'")}')">
                            <i class="fa-solid fa-cart-plus"></i> إضافة (طلب)
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // دالة البحث
        function filterGames() {
            const searchTerm = searchInput.value.toLowerCase();
            const filteredGames = gamesData.filter(game => 
                game.title.toLowerCase().includes(searchTerm)
            );
            renderGames(filteredGames);
        }

        // فتح النافذة المنبثقة
        function openModal(gameTitle) {
            gameNameInput.value = gameTitle;
            modal.classList.add('active');
            // إعادة تعيين حقول الإدخال
            phoneNumberInput.value = '';
            userMessageInput.value = 'أريد هذه اللعبة من فضلك';
            // التركيز على حقل رقم الهاتف
            setTimeout(() => phoneNumberInput.focus(), 100);
        }

        // إغلاق النافذة المنبثقة
        function closeModal() {
            modal.classList.remove('active');
        }

        // إغلاق النافذة عند النقر خارجها
        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                closeModal();
            }
        });

        // إرسال البيانات إلى الواتساب
        function sendToWhatsApp(event) {
            event.preventDefault(); // منع إعادة تحميل الصفحة

            const gameName = gameNameInput.value;
            const userMessage = userMessageInput.value;
            const phoneNumber = phoneNumberInput.value;

            // التحقق من المدخلات
            if (!phoneNumber || !userMessage) {
                alert('يرجى تعبئة جميع الحقول المطلوبة!');
                return;
            }

            // ⚠️ هام: ضع رقم الواتساب الخاص بك هنا بالصيغة الدولية (بدون أصفار أو +)
            // رقمك: 07712082333 -> يتحول إلى 9647712082333 (بافتراض أنك في العراق)
            const myWhatsAppNumber = "9647712082333"; 

            // تجهيز نص الرسالة
            const message = `مرحباً، لدي طلب لعبة:\n\n` +
                            `🎮 *اسم اللعبة:* ${gameName}\n` +
                            `💬 *الرسالة:* ${userMessage}\n` +
                            `📱 *رقم الهاتف:* ${phoneNumber}`;

            // تشفير النص ليتناسب مع الروابط
            const encodedMessage = encodeURIComponent(message);

            // إنشاء رابط الواتساب
            const whatsappUrl = `https://wa.me/${myWhatsAppNumber}?text=${encodedMessage}`;

            // فتح الرابط في نافذة جديدة
            window.open(whatsappUrl, '_blank');
            
            // إغلاق النافذة بعد الإرسال
            closeModal();
        }

        // تشغيل العرض الأولي عند تحميل الصفحة
        window.onload = () => {
            renderGames(gamesData);
        };
    </script>
</body>
</html>
